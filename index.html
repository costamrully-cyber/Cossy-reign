<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COSSY REIGN</title>
<meta name="description" content="COSSY REIGN — encrypted contact node. Find me everywhere." />
<meta name="theme-color" content="#000000" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@300;600;900&family=Nosifer&family=Metal+Mania&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ░░ LAYER 0 : hacking room ░░ -->
  <div class="room" aria-hidden="true"></div>

  <!-- ░░ LAYER 0 : live code rain ░░ -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- ░░ LAYER 1 : CRT scanlines + vignette ░░ -->
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ░░ LAYER 2 : content ░░ -->
  <main class="terminal">

    <header class="sigil">
      <p class="boot">&gt; establishing encrypted channel… <b>CONNECTED</b></p>
      <h1 class="logo" data-text="COSSY REIGN">COSSY REIGN</h1>
      <p class="tagline">// anonymous · untraceable · everywhere</p>
    </header>

    <section class="console" aria-label="Encrypted node panel">

      <div class="console-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="console-title">root@cossy-reign:~# ./connect --all-nodes</span>
      </div>

      <nav id="links" class="grid" aria-label="Social links"></nav>

      <!-- ░░ PLAY BLACKOUT NODE ░░ -->
      <a class="node play-node" href="game.html" aria-label="Play Blackout">
        <span class="ring">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </span>
        <span class="label-wrap">
          <span class="label">PLAY BLACKOUT</span>
          <span class="sub">ENDLESS · DAILY GRIND</span>
        </span>
        <span class="arrow">➜</span>
      </a>

      <div class="console-foot">
        <span class="pulse">●</span>
        <span>5 NODES ONLINE</span>
        <span class="sep">│</span>
        <span>CHANNEL ENCRYPTED</span>
        <span class="sep">│</span>
        <span>READY</span>
      </div>

    </section>

    <footer class="foot">
      <span>© COSSY REIGN</span>
      <span class="dot">◆</span>
      <span>no trackers · no logs · no mercy</span>
    </footer>

  </main>

  <!-- ░░ AMBIENT AUDIO ░░ -->
  <audio id="ambient" loop preload="auto">
    <source src="audio/theme.mp3" type="audio/mpeg" />
  </audio>

  <button id="soundToggle" class="sound-toggle" aria-label="Toggle ambient sound">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-on">
      <path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-off">
      <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 4v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
    <span class="sound-pulse"></span>
  </button>

  <script src="js/links.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/sound.js"></script>
</body>
</html>
